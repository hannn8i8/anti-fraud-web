<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彈窗防詐小遊戲</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", system-ui, sans-serif;
            background: #2410c9;
            color: #111;
            overflow: hidden;
        }

        button, a {
            font-family: inherit;
        }

        .game-page {
            height: 100vh;
            display: grid;
            grid-template-columns: 90px 1fr;
        }

        .left-bar {
            background: #3217e8;
            border-right: 5px solid #111;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 10;
        }

        .logo {
            font-size: 38px;
            transform: rotate(-12deg);
            filter: drop-shadow(3px 3px 0 black);
        }

        .side-btn {
            width: 55px;
            height: 55px;
            background: white;
            border: 4px solid #111;
            border-radius: 50%;
            box-shadow: 4px 4px 0 #111;
            font-size: 28px;
            display: grid;
            place-items: center;
            text-decoration: none;
            color: #111;
            cursor: pointer;
        }

        .sound {
            margin-top: auto;
        }

        .game-stage {
            position: relative;
            height: 100vh;
            padding: 26px;
            overflow: hidden;
            background:
                linear-gradient(rgba(7, 28, 46, 0.86), rgba(7, 28, 46, 0.86)),
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), transparent 26%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.12), transparent 30%),
                #0d2338;
        }

        .background-doodles {
            position: absolute;
            inset: 0;
            opacity: 0.18;
            pointer-events: none;
            background-image:
                linear-gradient(45deg, transparent 48%, white 49%, white 51%, transparent 52%),
                radial-gradient(circle, white 0 2px, transparent 3px);
            background-size: 120px 120px, 80px 80px;
        }

        .top-panel {
            position: relative;
            z-index: 4;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .title-box {
            background: #ffed59;
            border: 5px solid #111;
            border-radius: 18px;
            box-shadow: 7px 7px 0 #111;
            padding: 15px 22px;
            transform: rotate(-1deg);
        }

        .title-box h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 950;
        }

        .title-box p {
            margin: 6px 0 0;
            font-size: 18px;
            font-weight: 800;
        }

        .status-box {
            background: white;
            border: 5px solid #111;
            border-radius: 16px;
            box-shadow: 7px 7px 0 #111;
            padding: 12px 18px;
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 8px 18px;
            font-size: 22px;
            font-weight: 950;
        }

        .mission-card {
            position: absolute;
            left: 120px;
            bottom: 36px;
            z-index: 5;
            width: 390px;
            background: #ffed59;
            border: 5px solid #111;
            box-shadow: 7px 7px 0 #111;
            border-radius: 8px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: rotate(-1deg);
        }

        .mini-ad-icon {
            width: 82px;
            height: 82px;
            background: #83cdf5;
            border: 4px solid #111;
            display: grid;
            place-items: center;
            font-size: 42px;
        }

        .mission-card p {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
        }

        .mission-card h2 {
            margin: 3px 0 0;
            font-size: 28px;
            line-height: 1.18;
            font-weight: 950;
        }

        .phone-hint {
            position: absolute;
            right: 36px;
            bottom: 34px;
            z-index: 5;
            max-width: 480px;
            background: #80dce8;
            border: 5px solid #111;
            box-shadow: 7px 7px 0 #111;
            border-radius: 16px;
            padding: 18px;
            font-size: 22px;
            line-height: 1.45;
            font-weight: 850;
        }

        .popup-area {
            position: absolute;
            inset: 130px 30px 110px 30px;
            z-index: 3;
        }

        .popup {
            position: absolute;
            width: 270px;
            min-height: 230px;
            background: #f4e7c8;
            border: 5px solid #111;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            overflow: hidden;
            animation: popIn 0.18s ease-out;
        }

        @keyframes popIn {
            from {
                transform: scale(0.75) rotate(-4deg);
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .popup.danger {
            background: #c74b3d;
        }

        .popup.safe {
            background: #73c660;
        }

        .popup.fake-close {
            background: #7843b8;
        }

        .popup-top {
            height: 38px;
            background: #e75dcc;
            border-bottom: 5px solid #111;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            padding: 4px;
        }

        .window-button {
            width: 28px;
            height: 28px;
            background: #eee;
            border: 3px solid #111;
            display: grid;
            place-items: center;
            font-size: 18px;
            font-weight: 950;
            cursor: pointer;
        }

        .real-x {
            background: #ff422e;
        }

        .popup-body {
            padding: 16px;
            text-align: center;
        }

        .popup-emoji {
            font-size: 58px;
            margin-bottom: 8px;
        }

        .popup-title {
            font-size: 28px;
            font-weight: 950;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .popup-text {
            font-size: 18px;
            line-height: 1.35;
            font-weight: 800;
        }

        .popup-action {
            margin-top: 13px;
            display: inline-block;
            background: #ffed59;
            border: 4px solid #111;
            padding: 8px 14px;
            font-size: 20px;
            font-weight: 950;
            box-shadow: 4px 4px 0 #111;
            cursor: pointer;
        }

        .popup.closed {
            transform: scale(0);
            opacity: 0;
            transition: 0.16s;
        }

        .start-screen {
            position: fixed;
            inset: 0;
            z-index: 99;
            background:
                linear-gradient(rgba(45, 20, 210, 0.9), rgba(45, 20, 210, 0.9)),
                radial-gradient(circle at 30% 20%, #ffed59, transparent 26%),
                radial-gradient(circle at 80% 80%, #e75dcc, transparent 30%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .start-card {
            width: min(820px, 94vw);
            background: #83cdf5;
            border: 7px solid #111;
            box-shadow: 14px 14px 0 #111;
            border-radius: 18px;
            padding: 44px;
            text-align: center;
        }

        .start-card h1 {
            margin: 0 0 18px;
            font-size: 60px;
            font-weight: 950;
            text-shadow: 4px 4px 0 #ffed59;
        }

        .start-card p {
            font-size: 27px;
            line-height: 1.55;
            font-weight: 850;
        }

        .start-card .rule {
            color: #b40026;
        }

        .start-card button {
            background: #ffed59;
            border: 6px solid #111;
            box-shadow: 8px 8px 0 #111;
            border-radius: 14px;
            padding: 16px 65px;
            font-size: 42px;
            font-weight: 950;
            cursor: pointer;
            color: #d649c2;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            font-size: 22px;
            color: #111;
            font-weight: 900;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 120;
            background: rgba(0, 0, 0, 0.72);
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        .modal-window {
            width: min(760px, 92vw);
            background: #83cdf5;
            border: 6px solid #111;
            box-shadow: 12px 12px 0 #111;
            border-radius: 10px;
            overflow: hidden;
        }

        .window-top {
            height: 54px;
            background: #e75dcc;
            border-bottom: 5px solid #111;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
            padding: 0 12px;
        }

        .window-top span {
            width: 34px;
            height: 34px;
            background: #eee;
            border: 4px solid #111;
            display: grid;
            place-items: center;
            font-size: 24px;
            font-weight: 950;
        }

        .close-dot {
            background: #ff422e !important;
        }

        .modal-content {
            padding: 36px;
            text-align: center;
        }

        .result-emoji {
            font-size: 90px;
        }

        .modal-content h2 {
            margin: 8px 0 12px;
            font-size: 48px;
            font-weight: 950;
        }

        .modal-content p {
            font-size: 26px;
            line-height: 1.55;
            font-weight: 850;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 26px;
        }

        .result-buttons button,
        .result-buttons a {
            background: #ffed59;
            border: 5px solid #111;
            box-shadow: 6px 6px 0 #111;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 28px;
            font-weight: 950;
            cursor: pointer;
            text-decoration: none;
            color: #111;
        }

        .shake {
            animation: shake 0.25s linear;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-12px);
            }

            50% {
                transform: translateX(12px);
            }

            75% {
                transform: translateX(-8px);
            }
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .game-page {
                grid-template-columns: 1fr;
            }

            .left-bar {
                display: none;
            }

            .game-stage {
                min-height: 100vh;
                overflow-y: auto;
            }

            .top-panel {
                flex-direction: column;
            }

            .status-box {
                grid-template-columns: 1fr;
                width: 100%;
            }

            .popup-area {
                position: relative;
                inset: auto;
                min-height: 560px;
                margin-top: 30px;
            }

            .mission-card,
            .phone-hint {
                position: relative;
                left: auto;
                right: auto;
                bottom: auto;
                width: 100%;
                max-width: none;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="start-screen" class="start-screen">
        <div class="start-card">
            <h1>彈窗防詐挑戰</h1>
            <p>
                你正在幫阿公阿嬤使用手機。<br>
                螢幕上會一直跳出可疑廣告，請在時間內關掉它們！
            </p>
            <p class="rule">
                小心！有些按鈕是假按鈕，點錯會扣分。
            </p>
            <button onclick="startGame()">開始遊戲</button>
            <a href="index.html" class="back-link">回首頁</a>
        </div>
    </div>

    <main class="game-page">
        <aside class="left-bar">
            <div class="logo">👀</div>
            <a href="index.html" class="side-btn">🏠</a>
            <button class="side-btn" onclick="restartGame()">↻</button>
            <div class="side-btn sound">🔊</div>
        </aside>

        <section class="game-stage" id="game-stage">
            <div class="background-doodles"></div>

            <header class="top-panel">
                <div class="title-box">
                    <h1>關閉詐騙彈窗！</h1>
                    <p>不要被假優惠、假中獎、假投資騙走！</p>
                </div>

                <div class="status-box">
                    <div>⏱️ 時間：<span id="time">20</span></div>
                    <div>✅ 已關閉：<span id="closed-count">0</span></div>
                    <div>💰 存款：<span id="money">100</span>萬</div>
                    <div>⭐ 分數：<span id="score">0</span></div>
                </div>
            </header>

            <div class="mission-card">
                <div class="mini-ad-icon">📢</div>
                <div>
                    <p>任務目標</p>
                    <h2>在 20 秒內關閉所有詐騙廣告！</h2>
                </div>
            </div>

            <div id="popup-area" class="popup-area"></div>

            <div id="phone-hint" class="phone-hint">
                <strong>防詐提醒：</strong>
                看到「限時」、「保證獲利」、「先付手續費」、「中獎領獎」都要提高警覺！
            </div>
        </section>
    </main>

    <div id="result-modal" class="modal hidden">
        <div class="modal-window">
            <div class="window-top">
                <span></span>
                <span></span>
                <span class="close-dot">×</span>
            </div>

            <div class="modal-content">
                <div id="result-emoji" class="result-emoji">🎉</div>
                <h2 id="result-title">挑戰完成！</h2>
                <p id="result-text"></p>

                <div class="result-buttons">
                    <button onclick="restartGame()">再玩一次</button>
                    <a href="index.html">回首頁</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const popupArea = document.getElementById("popup-area");
        const timeEl = document.getElementById("time");
        const scoreEl = document.getElementById("score");
        const moneyEl = document.getElementById("money");
        const closedCountEl = document.getElementById("closed-count");
        const resultModal = document.getElementById("result-modal");
        const resultEmoji = document.getElementById("result-emoji");
        const resultTitle = document.getElementById("result-title");
        const resultText = document.getElementById("result-text");
        const gameStage = document.getElementById("game-stage");

        const ads = [
            {
                type: "scam",
                emoji: "💸",
                title: "穩賺投資",
                text: "加入老師群組，三天獲利 50,000！",
                button: "我要加入",
                className: "danger"
            },
            {
                type: "scam",
                emoji: "🎁",
                title: "恭喜中獎",
                text: "只要先付 99 元手續費即可領 iPhone。",
                button: "立即領獎",
                className: "danger"
            },
            {
                type: "scam",
                emoji: "📦",
                title: "包裹異常",
                text: "您的包裹卡關，請輸入信用卡重新配送。",
                button: "更新資料",
                className: "danger"
            },
            {
                type: "scam",
                emoji: "🏦",
                title: "銀行警告",
                text: "帳戶即將凍結，請立即登入驗證。",
                button: "立即登入",
                className: "danger"
            },
            {
                type: "fakeClose",
                emoji: "❌",
                title: "假關閉鈕",
                text: "這個 X 是假的！點下方按鈕會下載病毒。",
                button: "免費下載",
                className: "fake-close"
            },
            {
                type: "fakeClose",
                emoji: "⚠️",
                title: "不要點這裡",
                text: "這不是關閉按鈕，是陷阱廣告。",
                button: "關閉廣告",
                className: "fake-close"
            },
            {
                type: "safe",
                emoji: "🛡️",
                title: "防詐提醒",
                text: "165 反詐騙專線可以查證可疑訊息。",
                button: "知道了",
                className: "safe"
            }
        ];

        let timeLeft = 20;
        let score = 0;
        let money = 100;
        let closedCount = 0;
        let timer = null;
        let spawnTimer = null;
        let gameRunning = false;
        let popupId = 0;

        function startGame() {
            document.getElementById("start-screen").classList.add("hidden");

            timeLeft = 20;
            score = 0;
            money = 100;
            closedCount = 0;
            popupId = 0;
            gameRunning = true;

            popupArea.innerHTML = "";
            updateStatus();

            spawnInitialPopups();

            timer = setInterval(() => {
                timeLeft--;
                updateStatus();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnTimer = setInterval(() => {
                if (gameRunning) {
                    createPopup();
                }
            }, 1300);
        }

        function spawnInitialPopups() {
            for (let i = 0; i < 5; i++) {
                setTimeout(createPopup, i * 180);
            }
        }

        function createPopup() {
            if (!gameRunning) return;

            const ad = ads[Math.floor(Math.random() * ads.length)];
            const popup = document.createElement("div");

            popupId++;

            const x = randomNumber(0, Math.max(10, popupArea.clientWidth - 290));
            const y = randomNumber(0, Math.max(10, popupArea.clientHeight - 250));
            const rotate = randomNumber(-5, 5);
            const z = 10 + popupId;

            popup.className = `popup ${ad.className}`;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            popup.style.zIndex = z;
            popup.style.transform = `rotate(${rotate}deg)`;

            popup.innerHTML = `
                <div class="popup-top">
                    <div class="window-button">—</div>
                    <div class="window-button">□</div>
                    <div class="window-button real-x">×</div>
                </div>

                <div class="popup-body">
                    <div class="popup-emoji">${ad.emoji}</div>
                    <div class="popup-title">${ad.title}</div>
                    <div class="popup-text">${ad.text}</div>
                    <button class="popup-action">${ad.button}</button>
                </div>
            `;

            const closeBtn = popup.querySelector(".real-x");
            const actionBtn = popup.querySelector(".popup-action");

            closeBtn.addEventListener("click", (event) => {
                event.stopPropagation();
                closePopup(popup, ad);
            });

            actionBtn.addEventListener("click", (event) => {
                event.stopPropagation();
                clickAdTrap(popup, ad);
            });

            popup.addEventListener("mousedown", () => {
                popup.style.zIndex = 9999;
            });

            popupArea.appendChild(popup);

            if (popupArea.children.length > 13) {
                clickAdTrap(popup, ad);
            }
        }

        function closePopup(popup, ad) {
            if (!gameRunning) return;

            popup.classList.add("closed");

            setTimeout(() => {
                if (popup.parentNode) {
                    popup.remove();
                }
            }, 160);

            closedCount++;

            if (ad.type === "safe") {
                score += 5;
            } else {
                score += 10;
            }

            updateStatus();
        }

        function clickAdTrap(popup, ad) {
            if (!gameRunning) return;

            popup.classList.add("closed");

            setTimeout(() => {
                if (popup.parentNode) {
                    popup.remove();
                }
            }, 160);

            if (ad.type === "safe") {
                score += 3;
            } else {
                score -= 15;
                money -= 10;

                if (money < 0) money = 0;

                gameStage.classList.add("shake");
                setTimeout(() => {
                    gameStage.classList.remove("shake");
                }, 260);
            }

            updateStatus();

            if (money <= 0) {
                endGame();
            }
        }

        function updateStatus() {
            timeEl.textContent = timeLeft;
            scoreEl.textContent = score;
            moneyEl.textContent = money;
            closedCountEl.textContent = closedCount;
        }

        function endGame() {
            if (!gameRunning) return;

            gameRunning = false;

            clearInterval(timer);
            clearInterval(spawnTimer);

            let title = "";
            let text = "";
            let emoji = "";

            if (money >= 80 && score >= 100) {
                emoji = "🏆";
                title = "防詐高手！";
                text = `你成功關閉 ${closedCount} 個可疑彈窗，最後存款還有 ${money} 萬，總分 ${score} 分！`;
            } else if (money >= 50) {
                emoji = "👍";
                title = "還不錯，但要更小心！";
                text = `你關閉了 ${closedCount} 個彈窗，最後存款剩下 ${money} 萬，總分 ${score} 分。看到可疑連結要先查證！`;
            } else {
                emoji = "😭";
                title = "糟糕，存款危機！";
                text = `你最後存款只剩 ${money} 萬，總分 ${score} 分。記得：不要點不明連結，不要輸入信用卡，不要相信保證獲利！`;
            }

            resultEmoji.textContent = emoji;
            resultTitle.textContent = title;
            resultText.textContent = text;

            resultModal.classList.remove("hidden");
        }

        function restartGame() {
            clearInterval(timer);
            clearInterval(spawnTimer);

            resultModal.classList.add("hidden");
            document.getElementById("start-screen").classList.remove("hidden");

            popupArea.innerHTML = "";

            timeLeft = 20;
            score = 0;
            money = 100;
            closedCount = 0;
            gameRunning = false;

            updateStatus();
        }

        function randomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>
</body>
</html>
