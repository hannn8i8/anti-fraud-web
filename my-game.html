<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防詐騙互動小遊戲</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Microsoft JhengHei", system-ui, sans-serif;
    background: #2c145f;
    color: #111;
    overflow-x: hidden;
    overflow-y: auto;
}

button, a {
    font-family: inherit;
}

.hidden {
    display: none !important;
}

.game-layout {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 92px 1fr;
}

.side-bar {
    background: linear-gradient(180deg, #4b1fd6, #2f0f9e);
    border-right: 5px solid #111;
    padding: 18px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    z-index: 50;
    min-height: 100vh;
}

.logo {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #111;
    box-shadow: 4px 4px 0 #111;
    display: grid;
    place-items: center;
    font-size: 28px;
}

.side-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: white;
    border: 4px solid #111;
    box-shadow: 4px 4px 0 #111;
    display: grid;
    place-items: center;
    text-decoration: none;
    color: #111;
    font-size: 28px;
    cursor: pointer;
    font-weight: 900;
}

.sound {
    margin-top: auto;
}

.stage {
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.14), transparent 24%),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,0.1), transparent 30%),
        linear-gradient(180deg, #5f2cf4 0%, #3c1aaa 35%, #231043 100%);
}

.stage::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.10;
    pointer-events: none;
    background-image:
      linear-gradient(45deg, transparent 48%, #fff 49%, #fff 51%, transparent 52%),
      radial-gradient(circle, #fff 0 2px, transparent 3px);
    background-size: 120px 120px, 70px 70px;
}

.start-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
        linear-gradient(rgba(55, 24, 150, 0.92), rgba(55, 24, 150, 0.92)),
        radial-gradient(circle at 25% 20%, #d19cff, transparent 27%),
        radial-gradient(circle at 80% 80%, #7b3cff, transparent 30%);
}

.start-card {
    width: min(980px, 94vw);
    background: #f4ecff;
    border: 7px solid #111;
    box-shadow: 14px 14px 0 #111;
    border-radius: 22px;
    padding: 36px;
    text-align: center;
}

.start-top {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
    align-items: center;
}

.mascot-box {
    background: linear-gradient(180deg, #d8b9ff, #b383ff);
    border: 5px solid #111;
    border-radius: 24px;
    box-shadow: 8px 8px 0 #111;
    min-height: 240px;
    display: grid;
    place-items: center;
    padding: 16px;
}

.mascot-figure {
    position: relative;
    width: 160px;
    height: 160px;
}

.mascot-head {
    position: absolute;
    top: 8px;
    left: 34px;
    width: 92px;
    height: 92px;
    background: #120022;
    border-radius: 50%;
}

.mascot-horn-left,
.mascot-horn-right {
    position: absolute;
    width: 28px;
    height: 50px;
    background: #120022;
    top: -8px;
    border-radius: 50px 50px 10px 10px;
}

.mascot-horn-left {
    left: 26px;
    transform: rotate(-25deg);
}

.mascot-horn-right {
    right: 26px;
    transform: rotate(25deg);
}

.mascot-eye-left,
.mascot-eye-right {
    position: absolute;
    top: 36px;
    width: 20px;
    height: 12px;
    background: white;
    border-radius: 50%;
}

.mascot-eye-left {
    left: 52px;
    transform: rotate(-18deg);
}

.mascot-eye-right {
    right: 52px;
    transform: rotate(18deg);
}

.mascot-smile {
    position: absolute;
    left: 50%;
    top: 58px;
    transform: translateX(-50%);
    width: 52px;
    height: 24px;
    border-bottom: 8px solid white;
    border-radius: 0 0 40px 40px;
}

.mascot-wallet {
    position: absolute;
    left: 18px;
    bottom: 8px;
    width: 124px;
    height: 74px;
    background: #6c2ed9;
    border: 5px solid #111;
    border-radius: 14px;
    box-shadow: 4px 4px 0 #111;
    transform: rotate(-8deg);
}

.mascot-wallet::before {
    content: "😈";
    position: absolute;
    left: 12px;
    top: 12px;
    font-size: 28px;
}

.mascot-money {
    position: absolute;
    right: 4px;
    bottom: 44px;
    font-size: 40px;
    transform: rotate(10deg);
}

.mascot-coin {
    position: absolute;
    right: 10px;
    top: 104px;
    font-size: 26px;
}

.start-content h1 {
    margin: 0 0 12px;
    font-size: 52px;
    font-weight: 950;
    color: #35106c;
}

.start-content p {
    font-size: 24px;
    line-height: 1.55;
    font-weight: 850;
    margin: 0;
}

.mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-top: 30px;
}

.mode-btn {
    border: 6px solid #111;
    border-radius: 20px;
    box-shadow: 8px 8px 0 #111;
    padding: 24px 18px;
    cursor: pointer;
    font-weight: 950;
    font-size: 32px;
    transition: 0.12s;
}

.mode-btn:hover {
    transform: translate(-3px, -3px);
    box-shadow: 11px 11px 0 #111;
}

.mode-sms {
    background: #d9b5ff;
}

.mode-card {
    background: #8f59ff;
    color: white;
}

.back-home {
    display: inline-block;
    margin-top: 24px;
    color: #111;
    font-size: 22px;
    font-weight: 900;
}

.top-panel {
    position: relative;
    z-index: 5;
    padding: 24px 28px 0;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-start;
}

.title-box {
    background: #f4e27a;
    border: 5px solid #111;
    box-shadow: 7px 7px 0 #111;
    border-radius: 18px;
    padding: 14px 22px;
    transform: rotate(-1deg);
}

.title-box h2 {
    margin: 0;
    font-size: 36px;
    font-weight: 950;
}

.title-box p {
    margin: 6px 0 0;
    font-size: 18px;
    font-weight: 850;
}

.status-box {
    background: #fff;
    border: 5px solid #111;
    box-shadow: 7px 7px 0 #111;
    border-radius: 16px;
    padding: 12px 18px;
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 8px 18px;
    font-size: 21px;
    font-weight: 950;
}

.sms-scene {
    position: relative;
    z-index: 4;
    min-height: calc(100vh - 130px);
    display: grid;
    grid-template-columns: 42% 58%;
    gap: 20px;
    padding: 20px 28px 42px;
}

.phone-area {
    position: relative;
    min-height: 560px;
}

.big-phone {
    position: absolute;
    left: 8%;
    top: 10px;
    width: 300px;
    height: 520px;
    background: #f1d95b;
    border: 6px solid #111;
    border-radius: 36px;
    box-shadow: 12px 12px 0 rgba(0,0,0,0.65);
    transform: rotate(-8deg);
}

.big-phone::before {
    content: "3:43";
    position: absolute;
    top: 13px;
    left: 24px;
    color: #111;
    font-size: 20px;
    font-weight: 950;
}

.phone-screen {
    position: absolute;
    inset: 55px 22px 32px;
    background: #4f58e8;
    border: 5px solid #111;
    border-radius: 22px;
}

.sms-visual-card {
    position: absolute;
    left: 90px;
    top: 50px;
    width: 320px;
    height: 220px;
    background: linear-gradient(180deg, #e0c6ff, #c89cff);
    border: 5px solid #111;
    box-shadow: 7px 7px 0 #111;
    transform: rotate(8deg);
    z-index: 4;
    display: grid;
    place-items: center;
}

.sms-icon {
    font-size: 90px;
}

.sms-demon {
    position: absolute;
    right: 34px;
    top: 0;
    width: 120px;
    height: 120px;
    z-index: 6;
}

.sms-demon .head {
    position: absolute;
    inset: 0;
    background: #120022;
    border-radius: 50%;
    border: 5px solid white;
}

.sms-demon .horn-left,
.sms-demon .horn-right {
    position: absolute;
    top: -10px;
    width: 24px;
    height: 45px;
    background: #120022;
    border-radius: 50px;
    border: 4px solid white;
}

.sms-demon .horn-left {
    left: 12px;
    transform: rotate(-24deg);
}

.sms-demon .horn-right {
    right: 12px;
    transform: rotate(24deg);
}

.sms-demon .eye-left,
.sms-demon .eye-right {
    position: absolute;
    top: 42px;
    width: 18px;
    height: 10px;
    background: white;
    border-radius: 50%;
}

.sms-demon .eye-left {
    left: 30px;
    transform: rotate(-20deg);
}

.sms-demon .eye-right {
    right: 30px;
    transform: rotate(20deg);
}

.sms-demon .mouth {
    position: absolute;
    left: 50%;
    top: 62px;
    transform: translateX(-50%);
    width: 48px;
    height: 20px;
    border-bottom: 7px solid white;
    border-radius: 0 0 30px 30px;
}

.fake-keyboard {
    position: absolute;
    left: 128px;
    top: 340px;
    width: 360px;
    height: 155px;
    background: #b5f39a;
    border: 5px solid #111;
    border-radius: 18px;
    box-shadow: 6px 6px 0 #111;
    transform: rotate(8deg);
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    z-index: 5;
}

.key {
    background: #d8a0d8;
    border: 3px solid #111;
    border-radius: 5px;
}

.sms-note {
    position: absolute;
    left: 0;
    bottom: 18px;
    width: 360px;
    background: #ffed59;
    border: 5px solid #111;
    box-shadow: 7px 7px 0 #111;
    padding: 20px;
    font-size: 30px;
    font-weight: 950;
    line-height: 1.28;
    z-index: 8;
}

.sms-note span {
    color: #e91535;
    font-size: 40px;
}

.message-area {
    position: relative;
    padding-top: 20px;
}

.speech {
    background: #ffef72;
    border: 5px solid #111;
    border-radius: 30px;
    box-shadow: 8px 8px 0 #111;
    padding: 28px 34px;
    min-height: 178px;
    font-size: 30px;
    line-height: 1.5;
    font-weight: 950;
    position: relative;
    margin-bottom: 35px;
}

.speech::after {
    content: "";
    position: absolute;
    bottom: -33px;
    left: 70px;
    border-width: 33px 26px 0 0;
    border-style: solid;
    border-color: #111 transparent transparent transparent;
}

.speech::before {
    content: "";
    position: absolute;
    bottom: -24px;
    left: 76px;
    border-width: 24px 18px 0 0;
    border-style: solid;
    border-color: #ffef72 transparent transparent transparent;
    z-index: 2;
}

.chat-window {
    background: #fff27b;
    border: 5px solid #111;
    box-shadow: 8px 8px 0 #111;
    border-radius: 14px;
    overflow: hidden;
}

.chat-top {
    height: 55px;
    background: #de71d6;
    border-bottom: 5px solid #111;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 15px;
    font-size: 27px;
}

.fake-input {
    flex: 1;
    height: 30px;
    background: #fff48a;
    border: 4px solid #111;
    border-radius: 999px;
}

.choice-box {
    padding: 34px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    min-height: 250px;
}

.choice {
    border: 5px solid #111;
    border-radius: 20px;
    box-shadow: 6px 6px 0 #111;
    min-height: 150px;
    padding: 16px;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 950;
    cursor: pointer;
    transition: 0.12s;
}

.choice:hover {
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0 #111;
}

.choice-left {
    background: #85d9ef;
}

.choice-right {
    background: #dca0ff;
}

.chat-bottom {
    height: 62px;
    background: #de71d6;
    border-top: 5px solid #111;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
}

.small-key {
    width: 58px;
    height: 42px;
    background: #f6d56f;
    border: 4px solid #111;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 950;
}

.long-key {
    flex: 1;
    height: 42px;
    background: #cb5cc0;
    border: 4px solid #111;
    border-radius: 10px;
}

.card-scene {
    position: relative;
    z-index: 4;
    min-height: calc(100vh - 130px);
    padding: 20px 28px 70px;
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 24px;
}

.card-left-panel {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.card-mascot-card,
.card-tip-card {
    background: #f4ecff;
    border: 5px solid #111;
    box-shadow: 7px 7px 0 #111;
    border-radius: 20px;
    padding: 18px;
}

.card-mascot-card {
    min-height: 260px;
    display: grid;
    place-items: center;
}

.card-tip-card {
    font-size: 28px;
    font-weight: 950;
    line-height: 1.35;
    background: #f3e36f;
}

.card-tip-card span {
    color: #d11a4a;
    font-size: 40px;
}

.card-mascot-large {
    position: relative;
    width: 180px;
    height: 200px;
}

.card-mascot-large .body {
    position: absolute;
    left: 32px;
    top: 44px;
    width: 110px;
    height: 120px;
    background: #120022;
    border-radius: 60px 60px 50px 50px;
}

.card-mascot-large .head {
    position: absolute;
    left: 32px;
    top: 0;
    width: 110px;
    height: 110px;
    background: #120022;
    border-radius: 50%;
}

.card-mascot-large .horn-left,
.card-mascot-large .horn-right {
    position: absolute;
    width: 24px;
    height: 50px;
    background: #120022;
    border-radius: 50px;
    top: -12px;
}

.card-mascot-large .horn-left {
    left: 26px;
    transform: rotate(-24deg);
}

.card-mascot-large .horn-right {
    right: 26px;
    transform: rotate(24deg);
}

.card-mascot-large .eye-left,
.card-mascot-large .eye-right {
    position: absolute;
    top: 40px;
    width: 18px;
    height: 10px;
    background: white;
    border-radius: 50%;
}

.card-mascot-large .eye-left {
    left: 56px;
    transform: rotate(-18deg);
}

.card-mascot-large .eye-right {
    right: 56px;
    transform: rotate(18deg);
}

.card-mascot-large .mouth {
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
    width: 48px;
    height: 22px;
    border-bottom: 7px solid white;
    border-radius: 0 0 30px 30px;
}

.card-mascot-large .tail {
    position: absolute;
    right: 0;
    bottom: 12px;
    width: 76px;
    height: 76px;
    border-right: 8px solid #120022;
    border-bottom: 8px solid #120022;
    border-radius: 0 0 50px 0;
}

.card-mascot-large .tail::after {
    content: "";
    position: absolute;
    right: -13px;
    top: -2px;
    width: 0;
    height: 0;
    border-left: 14px solid #120022;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    transform: rotate(-40deg);
}

.card-mascot-large .money {
    position: absolute;
    left: 8px;
    bottom: 10px;
    font-size: 54px;
    transform: rotate(-12deg);
}

.card-board {
    display: grid;
    grid-template-columns: repeat(4, minmax(160px, 1fr));
    gap: 18px;
    align-content: start;
    padding-right: 10px;
}

.memory-card {
    height: 170px;
    perspective: 1000px;
    cursor: pointer;
}

.memory-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.38s;
    transform-style: preserve-3d;
}

.memory-card.flipped .memory-card-inner,
.memory-card.matched .memory-card-inner {
    transform: rotateY(180deg);
}

.memory-front,
.memory-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border: 5px solid #111;
    border-radius: 18px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.65);
    overflow: hidden;
}

.memory-front {
    background:
        repeating-linear-gradient(35deg, rgba(130, 68, 255, 0.18) 0 10px, transparent 10px 24px),
        linear-gradient(180deg, #f1d35f, #f4e27d);
    display: grid;
    place-items: center;
}

.memory-front::before {
    content: "😈  💸  🪙  🔒";
    font-size: 30px;
    opacity: 0.28;
    text-align: center;
    line-height: 1.8;
}

.memory-back {
    transform: rotateY(180deg);
    background: #f6ecff;
    display: grid;
    grid-template-rows: 1fr auto;
}

.memory-back.scam {
    background: linear-gradient(180deg, #c07cff, #9b58ea);
}

.memory-back.safe {
    background: linear-gradient(180deg, #b9a6ff, #8f8bf5);
}

.memory-icon {
    display: grid;
    place-items: center;
    font-size: 54px;
    padding-top: 10px;
}

.memory-label {
    background: white;
    border-top: 4px solid #111;
    min-height: 54px;
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 21px;
    font-weight: 950;
    padding: 6px;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.72);
    display: grid;
    place-items: center;
    padding: 20px;
}

.modal-window {
    width: min(800px, 92vw);
    background: #f4ecff;
    border: 6px solid #111;
    box-shadow: 12px 12px 0 #111;
    border-radius: 12px;
    overflow: hidden;
}

.window-top {
    height: 54px;
    background: #d36cf0;
    border-bottom: 5px solid #111;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    align-items: center;
    padding: 0 12px;
}

.window-dot {
    width: 34px;
    height: 34px;
    background: #eee;
    border: 4px solid #111;
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 950;
}

.close-dot {
    background: #ff422e;
}

.modal-content {
    padding: 36px;
    text-align: center;
}

.modal-emoji {
    font-size: 88px;
}

.modal-content h2 {
    font-size: 46px;
    margin: 8px 0 12px;
    font-weight: 950;
}

.modal-content p {
    font-size: 29px;
    line-height: 1.55;
    font-weight: 900;
}

.final-money {
    font-size: 40px;
    color: #d11a4a;
    font-weight: 950;
}

.warning-large {
    display: block;
    margin-top: 18px;
    font-size: 34px;
    line-height: 1.35;
    color: #35106c;
    font-weight: 950;
}

.modal-buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 26px;
    flex-wrap: wrap;
}

.modal-buttons button,
.modal-buttons a {
    background: #f4e27a;
    border: 5px solid #111;
    box-shadow: 6px 6px 0 #111;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 26px;
    font-weight: 950;
    cursor: pointer;
    text-decoration: none;
    color: #111;
}

.shake {
    animation: shake 0.25s linear;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    50% { transform: translateX(12px); }
    75% { transform: translateX(-8px); }
}

@media (max-width: 1100px) {
    .game-layout {
        grid-template-columns: 1fr;
    }

    .side-bar {
        display: none;
    }

    .top-panel {
        flex-direction: column;
    }

    .status-box {
        width: 100%;
        grid-template-columns: 1fr;
    }

    .start-top {
        grid-template-columns: 1fr;
    }

    .mode-buttons {
        grid-template-columns: 1fr;
    }

    .sms-scene {
        grid-template-columns: 1fr;
    }

    .phone-area {
        min-height: 560px;
    }

    .card-scene {
        grid-template-columns: 1fr;
    }

    .card-board {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
    }
}
</style>
</head>

<body>

<div id="start-screen" class="start-screen">
    <div class="start-card">
        <div class="start-top">
            <div class="mascot-box">
                <div class="mascot-figure">
                    <div class="mascot-head"></div>

const scoreEl = document.getElementById("score");

const modal = document.getElementById("modal");

let currentMode = "";
let score = 0;
let money = 100;
let successCount = 0;

function resetBase() {
    score = 0;
    money = 100;
    successCount = 0;
    updateStatus();
    modal.classList.add("hidden");
    modalNext.onclick = handleModalNext;
}

function updateStatus() {
    scoreEl.textContent = score;
    moneyEl.textContent = money;
    successCountEl.textContent = successCount;
}

function hideScenes() {
    smsScene.classList.add("hidden");
    memoryScene.classList.add("hidden");
}

function backToMenu() {
    currentMode = "";
    hideScenes();
    modal.classList.add("hidden");
    startScreen.classList.remove("hidden");
    gameTitle.textContent = "防詐騙互動小遊戲";
    gameSubtitle.textContent = "請先選擇模式開始遊玩。";
    progressEl.textContent = "0 / 0";
}

function restartCurrentMode() {
    if (currentMode === "sms") startSmsMode();
    if (currentMode === "memory") startMemoryMode();
}

function showModal(emoji, title, text, buttonText = "下一步") {
    modalEmoji.textContent = emoji;
    modalTitle.textContent = title;
    modalText.innerHTML = text;
    modalNext.textContent = buttonText;
    modal.classList.remove("hidden");
}

function shakeScreen() {
    document.getElementById("stage").classList.add("shake");
    setTimeout(() => {

}

let smsIndex = 0;

function startSmsMode() {
    currentMode = "sms";
    resetBase();
    hideScenes();
    startScreen.classList.add("hidden");
    smsScene.classList.remove("hidden");

    gameTitle.textContent = "簡訊防詐模式";
    gameSubtitle.textContent = "判斷訊息該相信，還是查證／封鎖。";

    smsIndex = 0;
    smsAnswered = false;
    document.getElementById("sms-total").textContent = smsCases.length;
    document.getElementById("sms-blocked").textContent = 0;

    loadSmsCase();
}

function loadSmsCase() {
    const item = smsCases[smsIndex];
    smsAnswered = false;

    document.getElementById("sms-icon").textContent = item.icon;
    document.getElementById("sms-message").textContent = item.message;
    document.getElementById("sms-left").textContent = item.left;
    document.getElementById("sms-right").textContent = item.right;
    progressEl.textContent = `${smsIndex + 1} / ${smsCases.length}`;
}

function answerSms(side) {
    if (smsAnswered) return;
    smsAnswered = true;

    const item = smsCases[smsIndex];
    const correct = side === item.correct;

    if (correct) {
        score += 20;
        successCount += 1;
        updateStatus();
        document.getElementById("sms-blocked").textContent = successCount;
        showModal("✅", "成功防詐！", item.good, smsIndex === smsCases.length - 1 ? "看結果" : "下一題");
    } else {
        score -= 10;
        money -= item.loss;
        if (money < 0) money = 0;
        updateStatus();
        shakeScreen();
        showModal("⚠️", "你被話術騙到了！", item.bad + ` 你損失了 ${item.loss} 萬元。`, smsIndex === smsCases.length - 1 ? "看結果" : "下一題");
    }
}

function nextSms() {
    modal.classList.add("hidden");

    if (smsIndex < smsCases.length - 1) {
        smsIndex++;
        loadSmsCase();
    } else {
        finishSmsMode();
    }
}

        title = "還不錯，但要更小心！";
        text = `

        `;
    }

    if (money < 50) {
        emoji = "😭";
        title = "存款危機！";
        text = `
            你被騙走太多錢了。<br>
            你最後只剩下 <span class="final-money">${money} 萬元</span>。<br>
            <span class="warning-large">防詐三步驟：不要點不明連結、不要輸入帳密、不要隨便匯款！</span>
        `;
    }

    showModal(emoji, title, text, "再玩一次");
    modalNext.onclick = startSmsMode;
}

let memoryCards = [];
let flippedCards = [];
let lockBoard = false;
let matchedPairs = 0;

function startMemoryMode() {
    currentMode = "memory";
    resetBase();
    hideScenes();
    startScreen.classList.add("hidden");
    memoryScene.classList.remove("hidden");

    gameTitle.textContent = "網路詐騙翻牌配對";
    gameSubtitle.textContent = "翻開兩張相同的牌，認識常見網路詐騙手法。";

    matchedPairs = 0;
    flippedCards = [];
    lockBoard = false;

    document.getElementById("memory-pairs").textContent = matchedPairs;
    progressEl.textContent = `${matchedPairs} / ${memoryData.length}`;

    buildMemoryBoard();
}

function buildMemoryBoard() {
    const board = document.getElementById("memory-board");
    board.innerHTML = "";

    memoryCards = shuffleArray([...memoryData, ...memoryData]);

    memoryCards.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "memory-card";
        card.dataset.key = item.key;
        card.dataset.index = index;

        card.innerHTML = `
            <div class="memory-card-inner">
                <div class="memory-front"></div>
                <div class="memory-back ${item.type}">
                    <div class="memory-icon">${item.icon}</div>
                    <div class="memory-label">${item.label}</div>
                </div>
            </div>
        `;

        card.addEventListener("click", () => flipMemoryCard(card, item));
        board.appendChild(card);
    });
}

function flipMemoryCard(card, item) {
    if (lockBoard) return;
    if (card.classList.contains("flipped")) return;
    if (card.classList.contains("matched")) return;

    card.classList.add("flipped");
    flippedCards.push({ card, item });

    if (flippedCards.length === 2) {
        checkMemoryMatch();
    }
}

function checkMemoryMatch() {
    const [first, second] = flippedCards;

    if (first.item.key === second.item.key) {
        first.card.classList.add("matched");
        second.card.classList.add("matched");

        matchedPairs++;
        successCount++;
        score += 15;

        updateStatus();
        document.getElementById("memory-pairs").textContent = matchedPairs;
        progressEl.textContent = `${matchedPairs} / ${memoryData.length}`;

        const explanation = first.item.explain;
        flippedCards = [];

        if (matchedPairs === memoryData.length) {
            showModal("🎉", `配對成功：${first.item.label}`, `${explanation}<br><br><span class="warning-large">你已經完成所有網路詐騙配對！</span>`, "看結果");
            modalNext.onclick = finishMemoryMode;
        } else {
            showModal("✅", `配對成功：${first.item.label}`, `${explanation}`, "繼續翻牌");
            modalNext.onclick = function () {
                modal.classList.add("hidden");
                modalNext.onclick = handleModalNext;
            };
        }
    } else {
        lockBoard = true;
        setTimeout(() => {
            first.card.classList.remove("flipped");
            second.card.classList.remove("flipped");
            flippedCards = [];
            lockBoard = false;
        }, 850);
    }
}

function finishMemoryMode() {
    const text = `
        你完成了全部 ${memoryData.length} 組網路詐騙配對。<br>
        總分：<span class="final-money">${score} 分</span>。<br>
        <span class="warning-large">網路詐騙重點：不點陌生連結、不在陌生網站輸入帳密、不相信保證獲利、不急著付款！</span>
    `;

    showModal("🏆", "網路詐騙識破高手！", text, "再玩一次");
    modalNext.onclick = startMemoryMode;
}

function handleModalNext() {
    if (currentMode === "sms") {
        nextSms();
    } else {
        modal.classList.add("hidden");
    }
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
